<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">AmbitionBox Scraper workflow</title><desc id="desc">A Python data collection workflow that requests listing pages, parses HTML, normalises company fields, and writes a CSV file.</desc><rect width="1200" height="400" rx="18" fill="#F5F2E9"/>
<text x="56" y="42" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#3F7257">PROJECT MAP / WORKFLOW</text><text x="56" y="78" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#28372E">AmbitionBox Scraper</text><text x="56" y="105" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#6B756E">Company listings into structured data</text><line x1="56" y1="125" x2="1144" y2="125" stroke="#D9DFD1"/><path d="M 300 237 L 330 237" stroke="#6B756E" stroke-width="1.8" fill="none"/><path d="M 325 232 L 330 237 L 325 242" stroke="#6B756E" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 584 237 L 614 237" stroke="#6B756E" stroke-width="1.8" fill="none"/><path d="M 609 232 L 614 237 L 609 242" stroke="#6B756E" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 868 237 L 898 237" stroke="#6B756E" stroke-width="1.8" fill="none"/><path d="M 893 232 L 898 237 L 893 242" stroke="#6B756E" stroke-width="1.8" fill="none" stroke-linejoin="round"/><g><rect x="56" y="158" width="236" height="158" rx="12" fill="#FFFDF7" stroke="#D9DFD1" stroke-width="1.4"/><rect x="56" y="158" width="236" height="5" rx="2.5" fill="#3F7257"/><text x="73" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#3F7257">01 / SOURCE</text><text x="73" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#28372E">Listing pages</text><text x="73" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B756E">Read company listing pages.</text></g><g><rect x="340" y="158" width="236" height="158" rx="12" fill="#FFFDF7" stroke="#D9DFD1" stroke-width="1.4"/><rect x="340" y="158" width="236" height="5" rx="2.5" fill="#B68A43"/><text x="357" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#B68A43">02 / REQUEST</text><text x="357" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#28372E">Fetch HTML</text><text x="357" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B756E">Send requests with headers.</text></g><g><rect x="624" y="158" width="236" height="158" rx="12" fill="#FFFDF7" stroke="#D9DFD1" stroke-width="1.4"/><rect x="624" y="158" width="236" height="5" rx="2.5" fill="#75917B"/><text x="641" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#75917B">03 / PARSE</text><text x="641" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#28372E">Extract fields</text><text x="641" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B756E">Parse ratings, salary, jobs, and details.</text></g><g><rect x="908" y="158" width="236" height="158" rx="12" fill="#FFFDF7" stroke="#D9DFD1" stroke-width="1.4"/><rect x="908" y="158" width="236" height="5" rx="2.5" fill="#3F7257"/><text x="925" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#3F7257">04 / EXPORT</text><text x="925" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#28372E">CSV dataset</text><text x="925" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B756E">Write rows for analysis.</text></g><text x="56" y="358" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#3F7257">IMPLEMENTATION NOTE</text><text x="56" y="380" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B756E">Respect the source site's terms, robots rules, and request limits.</text></svg>